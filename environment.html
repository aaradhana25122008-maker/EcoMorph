<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eco Utopia - City Environment Simulator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #dff6ff,
                    #e8f5e9,
                    #f1f8e9
                );

            color: #263238;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 94%;
            max-width: 1250px;
            margin: 25px auto;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            background: rgba(255,255,255,0.92);
            border-radius: 22px;
            padding: 25px;
            text-align: center;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.12);

            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #2e7d32;
        }

        .header p {
            margin-top: 8px;
            color: #607d8b;
            font-size: 1.05rem;
        }


        /* =========================
           CONTROLS
        ========================= */

        .controls {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 22px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.10);

            margin-bottom: 20px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .control {
            background: #f8faf8;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #e0e0e0;
        }

        .control label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .control-value {
            float: right;
            color: #2e7d32;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #43a047;
            cursor: pointer;
        }


        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            border-radius: 17px;
            padding: 18px;
            text-align: center;

            box-shadow:
                0 6px 20px rgba(0,0,0,0.10);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #2e7d32;
        }

        .stat-title {
            color: #607d8b;
            margin-top: 5px;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            background: #e8f5e9;
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            margin-bottom: 20px;

            transition: 0.5s;
        }

        .status h2 {
            margin: 0 0 7px 0;
        }


        /* =========================
           CITY
        ========================= */

        .city-container {
            border-radius: 25px;
            overflow: hidden;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.18);

            margin-bottom: 25px;
        }

        .city {
            position: relative;
            height: 500px;
            overflow: hidden;

            background: linear-gradient(
                #87ceeb,
                #dff6ff
            );

            transition: background 1s ease;
        }


        /* =========================
           SKY
        ========================= */

        .city.good {
            background:
                linear-gradient(
                    #62c8ff 0%,
                    #bdeeff 55%,
                    #e9f9ff 100%
                );
        }

        .city.medium {
            background:
                linear-gradient(
                    #9eb6c2,
                    #c8d3d7
                );
        }

        .city.bad {
            background:
                linear-gradient(
                    #59646b,
                    #9da5a8
                );
        }


        /* =========================
           SUN
        ========================= */

        .sun {
            position: absolute;
            top: 35px;
            right: 80px;

            width: 75px;
            height: 75px;

            border-radius: 50%;

            background: #ffd54f;

            box-shadow:
                0 0 35px rgba(255,213,79,0.9);

            animation: sunGlow 4s ease-in-out infinite;

            z-index: 1;
        }

        @keyframes sunGlow {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        .city.bad .sun {
            opacity: 0.12;
            box-shadow: none;
        }


        /* =========================
           CLOUDS
        ========================= */

        .cloud {
            position: absolute;

            width: 110px;
            height: 35px;

            background: rgba(255,255,255,0.85);

            border-radius: 50px;

            z-index: 2;

            animation: cloudMove 25s linear infinite;
        }

        .cloud:before,
        .cloud:after {
            content: "";

            position: absolute;

            background: inherit;

            border-radius: 50%;
        }

        .cloud:before {
            width: 50px;
            height: 50px;

            top: -20px;
            left: 20px;
        }

        .cloud:after {
            width: 65px;
            height: 65px;

            top: -30px;
            right: 10px;
        }

        .cloud1 {
            top: 70px;
            left: -150px;
        }

        .cloud2 {
            top: 130px;
            left: -350px;

            animation-delay: 8s;
        }

        @keyframes cloudMove {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(1500px);
            }
        }

        .city.bad .cloud {
            background: #56636b;
            opacity: 0.9;
        }


        /* =========================
           MOUNTAINS
        ========================= */

        .mountain {
            position: absolute;
            bottom: 125px;

            width: 0;
            height: 0;

            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-bottom: 170px solid #7cb342;

            z-index: 1;
        }

        .m1 {
            left: 40px;
        }

        .m2 {
            left: 270px;
            border-bottom-color: #689f38;
        }

        .m3 {
            right: 100px;
            border-bottom-color: #558b2f;
        }

        .city.bad .mountain {
            border-bottom-color: #5d665d;
        }


        /* =========================
           GROUND
        ========================= */

        .ground {
            position: absolute;
            bottom: 0;
            left: 0;

            width: 100%;
            height: 150px;

            background:
                linear-gradient(
                    #66bb6a,
                    #2e7d32
                );

            z-index: 3;

            overflow: hidden;

            transition: background 1s ease;
        }

        .ground:before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 40%,
                    rgba(255,255,255,0.15),
                    transparent 15%
                ),
                radial-gradient(
                    circle at 70% 60%,
                    rgba(255,255,255,0.10),
                    transparent 12%
                );

            animation: grassMove 6s ease-in-out infinite;
        }

        @keyframes grassMove {

            0%, 100% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(12px);
            }
        }

        .city.medium .ground {
            background:
                linear-gradient(
                    #78966f,
                    #536b4d
                );
        }

        .city.bad .ground {
            background:
                linear-gradient(
                    #555b48,
                    #414538
                );
        }


        /* =========================
           RIVER
        ========================= */

        .river {
            position: absolute;

            left: -5%;
            bottom: 65px;

            width: 58%;
            height: 105px;

            background:
                linear-gradient(
                    #29b6f6,
                    #0288d1
                );

            clip-path: polygon(
                0 25%,
                15% 10%,
                35% 30%,
                55% 12%,
                75% 35%,
                100% 20%,
                100% 100%,
                0 100%
            );

            z-index: 4;

            overflow: hidden;

            transition:
                background 1s ease,
                filter 1s ease;
        }

        .city.medium .river {
            background:
                linear-gradient(
                    #789f91,
                    #52796f
                );
        }

        .city.bad .river {
            background:
                linear-gradient(
                    #80603d,
                    #503923
                );

            filter: saturate(0.7);
        }


        /* =========================
           FLOWING WATER
        ========================= */

        .wave {
            position: absolute;

            width: 100px;
            height: 5px;

            border-radius: 50px;

            background: rgba(255,255,255,0.65);

            left: -130px;

            animation:
                waterFlow 3s linear infinite;
        }

        .wave1 {
            top: 25px;
        }

        .wave2 {
            top: 52px;
            animation-duration: 4s;
            animation-delay: 0.8s;
        }

        .wave3 {
            top: 78px;
            animation-duration: 3.5s;
            animation-delay: 1.5s;
        }

        @keyframes waterFlow {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(900px);
            }
        }

        .city.bad .wave {
            background: rgba(190,165,130,0.35);
        }


        /* =========================
           TREES
        ========================= */

        .tree {
            position: absolute;

            font-size: 50px;

            z-index: 8;

            animation:
                treeSway 3s ease-in-out infinite;
        }

        .tree1 {
            left: 30px;
            bottom: 105px;
        }

        .tree2 {
            left: 145px;
            bottom: 100px;
            font-size: 65px;
            animation-delay: 0.5s;
        }

        .tree3 {
            right: 60px;
            bottom: 105px;
            font-size: 58px;
            animation-delay: 1s;
        }

        .tree4 {
            right: 180px;
            bottom: 100px;
            font-size: 48px;
            animation-delay: 1.5s;
        }

        .tree5 {
            left: 420px;
            bottom: 108px;
            font-size: 43px;
            animation-delay: 2s;
        }

        @keyframes treeSway {

            0%, 100% {
                transform: rotate(-2deg);
            }

            50% {
                transform: rotate(2deg);
            }
        }

        .city.bad .tree {
            filter: grayscale(0.6);
            animation:
                badTreeSway 1.5s ease-in-out infinite;
        }

        @keyframes badTreeSway {

            0%, 100% {
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(5deg);
            }
        }


        /* =========================
           BUILDINGS
        ========================= */

        .building {
            position: absolute;

            bottom: 150px;

            width: 85px;

            background: #607d8b;

            border-radius: 5px 5px 0 0;

            z-index: 6;

            box-shadow:
                5px 5px 12px rgba(0,0,0,0.2);
        }

        .building1 {
            height: 135px;
            left: 300px;
        }

        .building2 {
            height: 175px;
            left: 410px;
        }

        .building3 {
            height: 115px;
            right: 290px;
        }

        .building span {
            display: block;

            margin: 12px auto;

            width: 14px;
            height: 14px;

            background: #ffeb3b;

            box-shadow:
                25px 0 #ffeb3b,
                0 25px #ffeb3b,
                25px 25px #ffeb3b;
        }

        .city.bad .building span {
            background: #8b8b72;

            box-shadow:
                25px 0 #8b8b72,
                0 25px #8b8b72,
                25px 25px #8b8b72;
        }


        /* =========================
           ROAD
        ========================= */

        .road {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 65px;

            background: #424242;

            z-index: 10;
        }

        .road-line {
            position: absolute;

            top: 29px;

            width: 100%;
            height: 6px;

            background:
                repeating-linear-gradient(
                    to right,
                    #fdd835 0px,
                    #fdd835 55px,
                    transparent 55px,
                    transparent 100px
                );
        }


        /* =========================
           FLOWERS / NATURE
        ========================= */

        .flower {
            position: absolute;

            font-size: 20px;

            z-index: 7;

            animation:
                flowerFloat 3s ease-in-out infinite;
        }

        .flower1 {
            left: 230px;
            bottom: 120px;
        }

        .flower2 {
            left: 520px;
            bottom: 118px;
            animation-delay: 1s;
        }

        .flower3 {
            right: 250px;
            bottom: 120px;
            animation-delay: 2s;
        }

        @keyframes flowerFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .city.bad .flower {
            filter: grayscale(1);
            opacity: 0.4;
        }


        /* =========================
           BUTTERFLIES
        ========================= */

        .butterfly {
            position: absolute;

            font-size: 24px;

            z-index: 12;

            animation:
                butterflyMove 8s ease-in-out infinite;
        }

        .butterfly1 {
            left: 20%;
            top: 48%;
        }

        .butterfly2 {
            left: 65%;
            top: 52%;

            animation-delay: 3s;
        }

        @keyframes butterflyMove {

            0% {
                transform: translate(0,0);
            }

            25% {
                transform: translate(50px,-25px);
            }

            50% {
                transform: translate(100px,10px);
            }

            75% {
                transform: translate(40px,35px);
            }

            100% {
                transform: translate(0,0);
            }
        }

        .city.medium .butterfly,
        .city.bad .butterfly {
            opacity: 0;
        }


        /* =========================
           WIND
        ========================= */

        .wind-layer {
            position: absolute;

            inset: 0;

            z-index: 17;

            pointer-events: none;

            opacity: 0;

            transition: opacity 0.7s;
        }

        .city.bad .wind-layer {
            opacity: 1;
        }

        .wind-line {
            position: absolute;

            left: -250px;

            height: 3px;

            border-radius: 20px;

            background: rgba(255,255,255,0.4);

            animation:
                windMove 2s linear infinite;
        }

        .wind1 {
            top: 35%;
            width: 170px;
        }

        .wind2 {
            top: 48%;
            width: 240px;
            animation-delay: 0.6s;
        }

        .wind3 {
            top: 62%;
            width: 130px;
            animation-delay: 1.1s;
        }

        .wind4 {
            top: 25%;
            width: 200px;
            animation-delay: 1.6s;
        }

        @keyframes windMove {

            from {
                transform: translateX(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateX(1500px);
                opacity: 0;
            }
        }


        /* =========================
           RAIN
        ========================= */

        .rain-layer {
            position: absolute;

            inset: 0;

            z-index: 20;

            pointer-events: none;

            opacity: 0;

            transition: opacity 0.8s;
        }

        .city.bad .rain-layer {
            opacity: 1;
        }

        .rain-drop {
            position: absolute;

            top: -30px;

            width: 2px;
            height: 18px;

            background:
                rgba(190,220,255,0.75);

            transform: rotate(12deg);

            animation:
                rainFall 0.8s linear infinite;
        }

        @keyframes rainFall {

            from {
                transform:
                    translateY(0)
                    rotate(12deg);
            }

            to {
                transform:
                    translateY(560px)
                    rotate(12deg);
            }
        }


        /* =========================
           POLLUTION HAZE
        ========================= */

        .pollution-haze {
            position: absolute;

            inset: 0;

            background:
                rgba(80,85,80,0.15);

            z-index: 15;

            pointer-events: none;

            opacity: 0;

            transition: opacity 1s;
        }

        .city.bad .pollution-haze {
            opacity: 1;
        }


        /* =========================
           POPUP
        ========================= */

        .popup {
            position: fixed;

            top: -120px;
            left: 50%;

            transform: translateX(-50%);

            background: white;

            padding: 17px 28px;

            border-radius: 15px;

            font-size: 1.05rem;
            font-weight: bold;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.2);

            z-index: 100;

            transition:
                top 0.5s ease;
        }

        .popup.show {
            top: 25px;
        }


        /* =========================
           BUTTON
        ========================= */

        .render-button {
            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #43a047,
                    #1b5e20
                );

            color: white;

            font-size: 1.1rem;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 6px 15px rgba(46,125,50,0.3);
        }

        .render-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(46,125,50,0.4);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 800px) {

            .control-grid,
            .stats {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .city {
                height: 450px;
            }

        }

    </style>
</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>🌍 ECO UTOPIA</h1>

        <p>
            City Environment Simulator
        </p>

        <p>
            Build your city. Protect your environment. Shape your future.
        </p>

    </div>



    <!-- CONTROLS -->

    <div class="controls">

        <div class="control-grid">


            <div class="control">

                <label>
                    🌳 Trees
                    <span class="control-value" id="treesValue">50</span>
                </label>

                <input
                    type="range"
                    id="trees"
                    min="0"
                    max="100"
                    value="50"
                >

            </div>


            <div class="control">

                <label>
                    🚗 Cars
                    <span class="control-value" id="carsValue">50</span>
                </label>

                <input
                    type="range"
                    id="cars"
                    min="0"
                    max="100"
                    value="50"
                >

            </div>


            <div class="control">

                <label>
                    🏭 Factories
                    <span class="control-value" id="factoriesValue">50</span>
                </label>

                <input
                    type="range"
                    id="factories"
                    min="0"
                    max="100"
                    value="50"
                >

            </div>


            <div class="control">

                <label>
                    ♻️ Recycling
                    <span class="control-value" id="recyclingValue">50</span>
                </label>

                <input
                    type="range"
                    id="recycling"
                    min="0"
                    max="100"
                    value="50"
                >

            </div>


            <div class="control">

                <label>
                    ☀️ Solar Energy
                    <span class="control-value" id="solarValue">50</span>
                </label>

                <input
                    type="range"
                    id="solar"
                    min="0"
                    max="100"
                    value="50"
                >

            </div>


            <div class="control">

                <label>
                    🚌 Public Transport
                    <span class="control-value" id="transportValue">50</span>
                </label>

                <input
                    type="range"
                    id="transport"
                    min="0"
                    max="100"
                    value="50"
                >

            </div>

        </div>

    </div>



    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <div
                class="stat-number"
                id="pollutionDisplay"
            >
                50
            </div>

            <div class="stat-title">
                Pollution Level
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="treesDisplay"
            >
                50
            </div>

            <div class="stat-title">
                Trees
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="ecoScore"
            >
                50
            </div>

            <div class="stat-title">
                Eco Score
            </div>

        </div>

    </div>



    <!-- STATUS -->

    <div
        class="status"
        id="status"
    >

        <h2 id="statusTitle">
            🌱 Balanced Ecosystem
        </h2>

        <p id="statusMessage">
            Your city is maintaining a balance between development and nature.
        </p>

    </div>



    <!-- CITY -->

    <div class="city-container">

        <div
            class="city medium"
            id="city"
        >


            <!-- SUN -->

            <div class="sun"></div>


            <!-- CLOUDS -->

            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>


            <!-- MOUNTAINS -->

            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>


            <!-- BUILDINGS -->

            <div class="building building1">
                <span></span>
            </div>

            <div class="building building2">
                <span></span>
            </div>

            <div class="building building3">
                <span></span>
            </div>


            <!-- RIVER -->

            <div class="river">

                <div class="wave wave1"></div>
                <div class="wave wave2"></div>
                <div class="wave wave3"></div>

            </div>


            <!-- TREES -->

            <div class="tree tree1">🌳</div>
            <div class="tree tree2">🌲</div>
            <div class="tree tree3">🌳</div>
            <div class="tree tree4">🌲</div>
            <div class="tree tree5">🌳</div>


            <!-- FLOWERS -->

            <div class="flower flower1">🌸</div>
            <div class="flower flower2">🌼</div>
            <div class="flower flower3">🌷</div>


            <!-- BUTTERFLIES -->

            <div class="butterfly butterfly1">
                🦋
            </div>

            <div class="butterfly butterfly2">
                🦋
            </div>


            <!-- GROUND -->

            <div class="ground"></div>


            <!-- ROAD -->

            <div class="road">

                <div class="road-line"></div>

            </div>


            <!-- POLLUTION HAZE -->

            <div class="pollution-haze"></div>


            <!-- WIND -->

            <div class="wind-layer">

                <div class="wind-line wind1"></div>
                <div class="wind-line wind2"></div>
                <div class="wind-line wind3"></div>
                <div class="wind-line wind4"></div>

            </div>


            <!-- RAIN -->

            <div
                class="rain-layer"
                id="rainLayer"
            ></div>


        </div>

    </div>



    <!-- BUTTON -->

    <button
        class="render-button"
        onclick="renderCity()"
    >

        🌍 BUILD MY CITY

    </button>


</div>



<!-- POPUP -->

<div
    class="popup"
    id="popup"
>
</div>



<script>


/* ===================================
   GET ELEMENTS
=================================== */

var trees =
    document.getElementById("trees");

var cars =
    document.getElementById("cars");

var factories =
    document.getElementById("factories");

var recycling =
    document.getElementById("recycling");

var solar =
    document.getElementById("solar");

var transport =
    document.getElementById("transport");


var city =
    document.getElementById("city");

var pollutionDisplay =
    document.getElementById("pollutionDisplay");

var treesDisplay =
    document.getElementById("treesDisplay");

var ecoScore =
    document.getElementById("ecoScore");

var statusTitle =
    document.getElementById("statusTitle");

var statusMessage =
    document.getElementById("statusMessage");

var status =
    document.getElementById("status");

var popup =
    document.getElementById("popup");

var rainLayer =
    document.getElementById("rainLayer");



/* ===================================
   CREATE RAIN
=================================== */

function createRain() {

    for (var i = 0; i < 70; i++) {

        var drop =
            document.createElement("div");

        drop.className = "rain-drop";

        drop.style.left =
            Math.random() * 100 + "%";

        drop.style.animationDelay =
            Math.random() * 1.5 + "s";

        drop.style.animationDuration =
            0.6 + Math.random() * 0.7 + "s";

        rainLayer.appendChild(drop);
    }
}

createRain();



/* ===================================
   CALCULATE POLLUTION
=================================== */

function calculatePollution() {

    var pollution =
        Number(cars.value) * 0.30
        +
        Number(factories.value) * 0.25
        +
        (100 - Number(recycling.value)) * 0.15
        +
        (100 - Number(transport.value)) * 0.10
        -
        Number(trees.value) * 0.12
        -
        Number(solar.value) * 0.08;


    if (pollution < 0) {
        pollution = 0;
    }

    if (pollution > 100) {
        pollution = 100;
    }


    pollution =
        Math.round(pollution);


    pollutionDisplay.textContent =
        pollution;


    /*
       ECO SCORE
       Higher score = healthier city
    */

    var score =
        100 - pollution;

    ecoScore.textContent =
        score;


    updateStatus(pollution);
}



/* ===================================
   UPDATE CITY STATUS
=================================== */

function updateStatus(pollution) {


    city.classList.remove(
        "good",
        "medium",
        "bad"
    );


    if (pollution < 30) {

        city.classList.add("good");


        statusTitle.textContent =
            "🌿 ECO UTOPIA";

        statusMessage.textContent =
            "Your city is thriving! Clean air, lush greenery and a healthy environment.";


        status.style.background =
            "#e8f5e9";


        showPopup(
            "🌿 YAY! Your city is pollution-free! Nature is thriving!"
        );

    }


    else if (pollution < 60) {

        city.classList.add("medium");


        statusTitle.textContent =
            "🌱 BALANCED ECOSYSTEM";

        statusMessage.textContent =
            "Your city is maintaining a balance between development and nature.";


        status.style.background =
            "#fff8e1";


        showPopup(
            "🌱 Your city is doing okay — but it can become greener!"
        );

    }


    else {

        city.classList.add("bad");


        statusTitle.textContent =
            "⚠️ CRITICAL POLLUTION";

        statusMessage.textContent =
            "Pollution levels are high. Nature is struggling and immediate action is needed.";


        status.style.background =
            "#ffebee";


        showPopup(
            "⚠️ OH NO! Pollution is damaging your city!"
        );

    }

}



/* ===================================
   POPUP
=================================== */

function showPopup(message) {

    popup.textContent =
        message;

    popup.classList.add("show");


    setTimeout(
        function() {

            popup.classList.remove("show");

        },
        3500
    );
}



/* ===================================
   UPDATE SLIDER VALUES
=================================== */

function updateValues() {


    document.getElementById(
        "treesValue"
    ).textContent = trees.value;


    document.getElementById(
        "carsValue"
    ).textContent = cars.value;


    document.getElementById(
        "factoriesValue"
    ).textContent = factories.value;


    document.getElementById(
        "recyclingValue"
    ).textContent = recycling.value;


    document.getElementById(
        "solarValue"
    ).textContent = solar.value;


    document.getElementById(
        "transportValue"
    ).textContent = transport.value;


    treesDisplay.textContent =
        trees.value;


    calculatePollution();
}



/* ===================================
   RENDER CITY
=================================== */

function renderCity() {

    var pollution =
        Number(
            pollutionDisplay.textContent
        );


    if (pollution < 30) {

        showPopup(
            "🌿 YAY! Your city is pollution-free! The river is flowing clean and nature is thriving!"
        );

    }

    else if (pollution < 60) {

        showPopup(
            "🌱 Your city is balanced. A little more green energy could make it even better!"
        );

    }

    else {

        showPopup(
            "🌧️ Pollution is critical! Strong winds and rain are hitting your city!"
        );

    }

}



/* ===================================
   SLIDER EVENTS
=================================== */

trees.addEventListener(
    "input",
    updateValues
);

cars.addEventListener(
    "input",
    updateValues
);

factories.addEventListener(
    "input",
    updateValues
);

recycling.addEventListener(
    "input",
    updateValues
);

solar.addEventListener(
    "input",
    updateValues
);

transport.addEventListener(
    "input",
    updateValues
);



/* ===================================
   INITIAL DISPLAY
=================================== */

updateValues();


</script>


</body>
</html>
